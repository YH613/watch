name: Watch

on:
  schedule:
    # 10 分ごとに頼んでいるが、GitHub の無料スケジュールは大幅に遅延する。
    # 実測（2026-11-06〜17 の 47 回）では間隔の中央値が 382 分だった。
    # 速さが要る監視はここに頼らず、常時稼働側で回すこと。
    - cron: '*/10 * * * *'
  workflow_dispatch:

# 前の実行が長引いても二重に走らせない
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ブラウザは毎回落とすと 1 分以上かかる
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # キャッシュヒットで導入を飛ばすと、一度不完全なキャッシュが
      # 保存された時点から毎回ブラウザ起動に失敗し続ける（キャッシュキーは
      # 固定なので自然復旧しない）。install は入っていれば数秒で終わるので
      # 常に走らせ、OS 側の依存は毎回入れる（ランナーは毎回新しい）。
      - name: Install Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop(); print('chromium 起動確認OK')"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: |
            watch-state-

      - name: Run
        env:
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch.py --state state.json

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
